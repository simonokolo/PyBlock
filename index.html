<!DOCTYPE html>
<html lang="en">
<head>
    <title>Authenticate - PyBlock</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="icon" type="image/x-icon" href="/images/logo/pyblock-icon.ico">
</head>
<body>
    <div class="wrapper">
        <img src="images/logo.png" alt="PyBlock Logo" class="logo">

        <div class="index-container">

            <!-- Sign In -->
            <div class="signin-container" id="signin-container">
                <h1>Sign In</h1>
                <div class="signin-form">
                    <form id="signin-form">
                        <label for="signin-email">Email</label>
                        <input type="email" id="signin-email" name="email" required>

                        <div class="label-row">
                            <label for="signin-password">Password</label>
                            <a href="#" id="forgot-password-link">Forgot Password?</a>
                        </div>
                        <input type="password" id="signin-password" name="password" required>

                        <button type="submit" class="button-primary full-width">Sign In</button>

                        <div class="auth-alt-row">
                            <button type="button" class="button-google" id="continue-with-google">
                                <img src="images/google-logo.png" alt="Google Logo" class="google-logo">
                                Continue with Google
                            </button>
                            <button type="button" class="button-secondary" onclick="toggleSigninSignup()">Sign Up</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Sign Up -->
            <div class="signup-container" id="signup-container">
                <h1>Sign Up</h1>
                <div class="signup-form">
                    <form id="signup-form">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" name="email"
                               pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required>

                        <label for="signup-username">Username</label>
                        <input type="text" id="signup-username" name="username"
                               pattern="^[a-zA-Z0-9_]{4,16}$" required>

                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" name="password"
                               pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$" required>

                        <button type="submit" class="button-primary full-width">Sign Up</button>

                        <div class="auth-alt-row">
                            <button class="button-google" id="continue-with-google-signup">
                                <img src="images/google-logo.png" alt="Google Logo" class="google-logo">
                                Continue with Google
                            </button>
                            <button type="button" class="button-secondary" onclick="toggleSigninSignup()">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Forgot Password -->
            <div class="forgot-password-container" id="forgot-password-container">
                <h1>Forgot Password</h1>
                <div class="forgot-password-form">
                    <form id="forgot-password-form">
                        <label for="forgot-password-email">Email</label>
                        <input type="email" id="forgot-password-email" name="email" required>

                        <button type="submit" class="button-primary full-width">Reset Password</button>
                        <div class="auth-alt-row">
                            <button type="button" class="button-secondary" onclick="showView('signin')">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script>
        // Cache containers and fields
        const pages = {
            signin: document.getElementById("signin-container"),
            signup: document.getElementById("signup-container"),
            forgot: document.getElementById("forgot-password-container")
        };

        const fields = {
            signin: [
                document.getElementById("signin-email"),
                document.getElementById("signin-password")
            ],
            signup: [
                document.getElementById("signup-email"),
                document.getElementById("signup-username"),
                document.getElementById("signup-password")
            ],
            forgot: [
                document.getElementById("forgot-password-email")
            ]
        };

        // Show a specific view and update required fields
        function showView(viewName) {
            Object.keys(pages).forEach(name => {
                pages[name].style.display = (name === viewName) ? "block" : "none";
                fields[name].forEach(field => field.required = (name === viewName));
            });
        }

        // Toggle between signin and signup
        function toggleSigninSignup() {
            const nextView = (pages.signin.style.display === "none") ? "signin" : "signup";
            showView(nextView);
        }

        // Event for forgot password link
        document.getElementById("forgot-password-link").addEventListener("click", e => {
            e.preventDefault();
            showView("forgot");
        });

        // Initialize default view
        showView("signin");
    </script>
</body>
</html>
